; PlatformIO Project Configuration File
; APRS_NAVARRICA_FAKETEC_433 ??? APRS-LoRa digipeater/iGate firmware (nRF52840)
; License: GPL-3.0
;
; Stack (N-11/N-06): nordicnrf52 + Adafruit nRF52 Arduino core + RadioLib
; Board: boards\faketec-nrf52840.json + variants\faketec\ (real Faketec pinout,
; N-01). UF2 post-build: uf2conv.py -c -f 0xADA52840 (N-06, limit < 0xEA000).

[platformio]
default_envs = faketec_sx1262_433

; QUE FICHERO DE PANTALLA SE COMPILA EN CADA PLACA
; PlatformIO compila TODOS los .cpp de src/, asi que hay que decirle cual sobra:
;   - placas con OLED (Faketec)      -> display.cpp;        sobra display_epaper.cpp
;   - placas con tinta electronica   -> display_epaper.cpp; sobra display.cpp
; (Si se compilaran los dos, el enlazador se queja, con razon: las dos versiones
;  definen las mismas funciones.) El filtro va en CADA entorno para que se vea.

[env]
platform = nordicnrf52 @ 10.11.0
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -std=gnu++17
    -DAPP_VERSION_STR=\"1.0alpha\"
    ; NUMERO DE COMPILACION INTERNO (idea del operador, 2026-09-13): un contador que
    ; sube en cada compilacion. NO sale en la pantalla de arranque: sirve para
    ; CONSULTAR que firmware lleva el nodo y no volver a dudar de si lo que se grabo
    ; es lo que uno cree (paso hoy: todas las versiones anunciaban "1.0alpha" igual).
    ; Se ve en la consola USB con "version" y en el registro de arranque.
    ; ★ DESDE EL 2026-09-15 ESTO YA NO SE SUBE A MANO: lo lleva
    ;   pre:extra_scripts/sube_buildnum.py, que comprueba al empezar que este numero y
    ;   `.buildnum` digan lo mismo (si no, PARA la compilacion) y lo sube +1 en los
    ;   dos sitios cuando la compilacion termina bien. Una tanda de compilacion
    ;   (aunque sean los 7 entornos) gasta UN solo numero.
    -DAPP_BUILD_NUM=\"b164\"
lib_deps =
    jgromes/RadioLib@^7.7.1
    bblanchon/ArduinoJson@^7.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit BMP280 Library@^2.6.0
    adafruit/Adafruit BME280 Library@^2.2.0
    adafruit/Adafruit BME680 Library@^2.0.0
    adafruit/Adafruit AHTX0@^2.0.0
    adafruit/Adafruit INA219@^1.1.0
    ; Motor haptico del T-Echo Plus (DRV2605). Se usa la libreria de Adafruit, igual que
    ; para los sensores: los registros del chip NO se inventan. En las placas sin motor
    ; (Faketec y T-Echo normal) el codigo queda inerte (ver src/haptic.cpp).
    adafruit/Adafruit DRV2605 Library
    https://github.com/meshtastic/esp8266-oled-ssd1306/archive/2e26010040e028baee72e2093402fa7b3c59e430.zip

; ============================================================================
; ★ SOFTDEVICE ESPERADO POR ENTORNO (2026-09-17, b26) — NO QUITAR
;
; PARA QUE: el nodo NO deja que nadie le desmonte el USB hasta saber que el Bluetooth va a
; poder arrancar. Lo comprueba leyendo el `fwid` del SoftDevice de la flash (esta en
; 0x2000+0x0C; los offsets son de `nrf_sdm.h`), ANTES de llamar a `Bluefruit.begin()`.
; Si no coincide, el Bluetooth no se arranca y el nodo sigue vivo por cable y por radio.
;
; ★ POR QUE HIZO FALTA (medido en la placa del operador con el b25 el 2026-09-17): con
;   `bleEnabled=1` guardado y un SoftDevice que no arranca, el nodo se quedaba en un ir y
;   venir del puerto USB y SIN CONSOLA. La recuperacion a mano del USB no bastaba: hay que
;   no llegar a desmontarlo.
;
; ★ DE DONDE SALE EL NUMERO: es el `sd_fwid` de la definicion de placa
;   (`boards\<placa>.json`), el mismo que pide el paquete DFU (`--sd-req`). NO INVENTARLO:
;     - S140 6.1.1 -> 0x00B6   (Faketec y T-Echo "normales")
;     - S140 7.x   -> 0x0123   (T-Echo con SoftDevice 7)
;   ★ Y OJO CON LA DIRECCION, que costo dos diagnosticos falsos (corregido el 2026-09-17,
;     b29): la ficha del SoftDevice NO esta en 0x2000+0x0C, sino en
;     **MBR_SIZE + 0x2000 + 0x0C = 0x300C**, porque el offset de `nrf_sdm.h` es relativo al
;     inicio del SoftDevice, que empieza despues del MBR (0x1000). Lo que hay en 0x200C es
;     CODIGO del SoftDevice: por eso salian 0xE002 y 0xD902, que este proyecto tomo por chips
;     averiados. Comprobado leyendo los hex oficiales (`tools\lee_hex.py`).
;   Si algun dia se anade un entorno con otro SoftDevice, hay que anadir su linea aqui o el
;   nodo dira (con razon) que el SoftDevice no es el suyo y no arrancara el Bluetooth.
; ============================================================================

; HT-RA62 (SX1262 22 dBm, P0.17 = RXEN)
[env:faketec_sx1262_433]
board = faketec-nrf52840
; ★★ SIN BLUETOOTH (2026-09-22): hasta hoy el Bluetooth solo estaba fuera en los T-Echo, y
;    las dos Faketec lo compilaban (comprobado: `ble_kiss.cpp.o` y 46 simbolos de la pila
;    Bluefruit dentro del binario). La norma del proyecto es que el Bluetooth va FUERA, asi que
;    se igualan: `-<ble_kiss.cpp>` lo saca del binario y `-DBLE_FUERA` deja inertes sus siete
;    llamadas. Son ~91 KB menos de binario en cada una.
src_filter = +<*> -<display_epaper.cpp> -<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp> -<ble_kiss.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_FAKETEC
    -D FAKETEC_RADIO_SX1262
    -D HAS_OLED=1
    -D SD_ESPERADO_FWID=0x00B6
    -D BLE_FUERA=1
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; E22P-433M30S (SX1262 12 dBm, P0.17 = module power enable) ??? N-02 limits
[env:faketec_e22p_433]
board = faketec-nrf52840
; ★★ SIN BLUETOOTH (2026-09-22): igual que `faketec_sx1262_433`, ver la nota de arriba.
src_filter = +<*> -<display_epaper.cpp> -<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp> -<ble_kiss.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_FAKETEC
    -D FAKETEC_RADIO_E22P
    -D HAS_OLED=1
    -D SD_ESPERADO_FWID=0x00B6
    -D BLE_FUERA=1
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; ============================================================================
; LilyGO T-Echo y T-Echo Plus (nRF52840 + SX1262 + pantalla de tinta electronica)
; Pinout y diferencias: docs/HARDWARE_TECHO.md   ·   Pines: src/pins_techo.h
;
; LAS DOS PLACAS COMPARTEN PINOUT (lo dice LilyGO con todas las letras). El Plus
; anade bateria de 2400 mAh, IMU BHI260AP, motor haptico DRV2605 y zumbador. Por
; eso hay DOS entornos aunque el hardware sea casi el mismo: el define TEchoPlus
; existe para cuando queramos usar esos extras (hoy no se usan).
;
; OJO: NO llevan OLED. QUE PANTALLA COMPILA CADA ENTORNO. ★ ESTE COMENTARIO SE EQUIVOCO
; DOS VECES Y HAY QUE DEJARLO CLARO DE UNA VEZ (corregido 2026-09-15, tras verificar el
; BINARIO; primero decia que los cuatro compilaban el sustituto VACIO, y despues que solo
; el Plus compilaba el driver: LAS DOS COSAS ERAN FALSAS):
;   - los CUATRO entornos techo (techo, techo_plus, techo_s140v7 y techo_plus_s140v7)
;     compilan src/epaper_techo.cpp, el DRIVER DE VERDAD, y LA PANTALLA SE DIBUJA TAMBIEN
;     EN EL T-ECHO NORMAL. Comprobado, no deducido: `epaper_techo.cpp.o` esta en el build de
;     techo_s140v7 y las cadenas del driver ("FIJAR COORDS", "Asentando", "carrusel")
;     estan DENTRO de su firmware.uf2.
;   - display_epaper.cpp (el sustituto vacio) esta EXCLUIDO en los cuatro (src_filter).
;   - El driver NO depende de TEchoPlus: su cuerpo va tras `#if !HAS_OLED` (una sola
;     condicion, en las lineas 75 y 4579 del fichero). Lo que si es exclusivo del Plus son
;     los AVISOS: el zumbador (`#if defined(PIN_BUZZER)`) y el motor haptico (haptic.cpp).
;     La pantalla es la misma en las dos placas.
; ============================================================================

; LilyGO T-Echo (bateria 850 mAh, BME280, sin IMU)
[env:techo]
board = techo-nrf52840
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEcho
    -D HAS_OLED=0
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; LilyGO T-Echo Plus (bateria 2400 mAh, BME280, IMU BHI260AP, motor y zumbador)
[env:techo_plus]
board = techo-nrf52840
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; ============================================================================
; T-Echo que llevan grabado el SoftDevice S140 **version 7** (7.2.0)
;
; POR QUE HAY DOS ENTORNOS PARA LA MISMA PLACA: el SoftDevice es el firmware de radio
; que va DEBAJO del nuestro, y ocupa la parte baja de la memoria. La version 6 deja la
; aplicacion en 0x26000; la version 7 la deja en 0x27000. Si se graba un binario
; enlazado para la v6 en una placa con la v7, se pisan los ultimos 4 KB del SoftDevice
; (o el bootloader lo rechaza, o deja la radio inservible).
;
; COMO SABER QUE VERSION LLEVA TU PLACA: en modo grabacion, mira el fichero
; INFO_UF2.TXT de la unidad. Si dice "SoftDevice: S140 version 7.2.0" (o 7.x), este es
; tu entorno. Si dice 6.1.1, usa `techo` o `techo_plus`.
; ============================================================================

; ============================================================================
; ★ BUS SPI DE LA PANTALLA DE TINTA ELECTRONICA — LO QUE SE PROBO Y COMO ESTA HOY
;   (bloque CORREGIDO el 2026-09-15: antes decia que el driver "NECESITA" SPIM0 y
;    que los sensores se habian movido a TWIM1, y hoy NADA de eso es cierto)
;
; 1) PROBADO Y DESCARTADO: poner la pantalla en SPIM0 (`-D NRFX_SPIM0_ENABLED=1` con
;    EPD_SPI_DEV = NRF_SPIM0, moviendo el I2C a TWIM1 para liberar el bloque). SPIM0 y
;    TWIM0 son EL MISMO bloque de hardware (los dos en 0x40003000) y el `Wire` del core
;    ocupa TWIM0, que es por lo que el core trae `NRFX_SPIM0_ENABLED 0 // used as I2C`.
;    Resultado medido: COMPILA pero CUELGA EL NODO al arrancar (no responde por USB y
;    hay que recuperarlo entrando en DFU a mano). Descartado.
;
; 2) LO QUE HAY HOY: NINGUN entorno de este fichero define NRFX_SPIM0_ENABLED, y los
;    sensores I2C se quedan en TWIM0 (`Wire`) como en las Faketec. La pantalla pinta por
;    BIT-BANG como transporte por defecto, con SPIM2 como alternativa en caliente
;    (comando de taller `epdtrans`). Ver src/epaper_techo.cpp y
;    docs/INTEGRACION_PANTALLA.md.
;
; 3) La causa raiz que costo mas encontrar: en este core el objeto global `SPI` de
;    Arduino vive en SPIM3, que es el mismo periferico que usaba el driver; como la
;    radio llama a `SPI.begin()` antes y su begin() empieza con `if (initialized)
;    return;`, los comandos de la pantalla salian por el bus de la RADIO. De ahi que su
;    pin BUSY no se moviese nunca. Arreglado llamando a `displayInitTrasRadio()` DESPUES
;    de `radioSetup()` (ver src/main.cpp).
; ============================================================================


; T-Echo con SoftDevice S140 v7 (aplicacion en 0x27000)
[env:techo_s140v7]
board = techo-nrf52840-s140v7
; ★★ SIN BLUETOOTH (2026-09-21): `-<ble_kiss.cpp>` saca el enlace del binario y
;    `-DBLE_FUERA` deja inertes sus siete llamadas. Es como se compilo el b68 que el
;    operador verifico en placa, y es la norma del proyecto ("el Bluetooth va fuera").
;    Son 91 KB menos de binario y una pila entera que no se enlaza. Para volver a un
;    firmware CON Bluetooth (solo para banco), se quitan las dos cosas.
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<diag_sd_main.cpp> -<ble_kiss.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEcho
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; ============================================================================
; ★ FIRMWARE MINIMO DE PRUEBA DE LA PANTALLA — "hello world"
;
; PARA QUE ES: probar SOLO la pantalla de tinta electronica del T-Echo Plus, sin
; radio, sin GPS, sin sensores y sin escribir en la flash. Es un banco de pruebas:
; si aqui no se ve nada, el sospechoso es la pantalla; si aqui SI se ve, el fallo
; esta en como el firmware bueno le da el bus.
;
; ★★ ESTE ENTORNO NO COMPILA HOY, Y SE DEJA DICHO A PROPOSITO (2026-09-15) ★★
; El `build_src_filter` de abajo deja SOLO `src/hello_techo.cpp`, y ese fichero NO
; esta en este arbol: vive en la copia antigua del proyecto, en
;     ..\Faketec_APRS_Igate_EA2OY\src\hello_techo.cpp
; (con su documento, ..\Faketec_APRS_Igate_EA2OY\docs\HELLO_WORLD_TECHO.md).
; Por eso PlatformIO contesta "Error: Nothing to build" al pedir este entorno.
;
; EL RESCATE DE VERDAD, EL QUE FUNCIONA SIN COMPILAR NADA, es el UF2 ya generado:
;     RESCATE_hello.uf2   (en la raiz de esta carpeta, _trabajo_ea2oy\)
; Se graba igual que cualquier otro: doble toque al reset, y copiarlo a la unidad.
;
; SI ALGUN DIA HAY QUE REGENERAR EL BINARIO, hay que traer antes el fuente:
;     Copy-Item ..\Faketec_APRS_Igate_EA2OY\src\hello_techo.cpp src\hello_techo.cpp
; (Lo que NO se hace es inventarse otro fichero con ese nombre.)
; Lleva el comando "dfu confirm" para poder volver al cargador desde el USB.
; ============================================================================
[env:techo_plus_hello]
board = techo-nrf52840-s140v7
build_src_filter = +<hello_techo.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
; Este banco de pruebas no usa librerias propias: se declara la lista VACIA para que no
; se compile RadioLib/ArduinoJson/BME280/etc (que es lo que arrastran los demas .cpp de
; src/). Lo unico que hace falta es el USB (el `Serial` de este core es un
; Adafruit_USBD_CDC y vive en la libreria Adafruit TinyUSB, dentro del framework): para
; eso basta con que hello_techo.cpp la incluya, y el buscador de dependencias la trae.
lib_deps =
lib_ldf_mode = deep+
build_flags =
    -Wall
    -std=gnu++17
    -DAPP_VERSION_STR=\"hello\"
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; T-Echo Plus con SoftDevice S140 v7 (aplicacion en 0x27000)
[env:techo_plus_s140v7]
board = techo-nrf52840-s140v7
; ★★ SIN BLUETOOTH (2026-09-21): ver la nota del entorno `techo_s140v7`. Este es el
;    entorno de la placa del operador (T-Echo Plus), y la norma del proyecto es que el
;    Bluetooth va fuera: `-<ble_kiss.cpp>` lo saca del binario y `-DBLE_FUERA` deja
;    inertes sus siete llamadas.
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<hello_techo.cpp> -<diag_sd_main.cpp> -<ble_kiss.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
; ★ DRIVER DE VERDAD CONECTADO (2026-09-14): el sustituto vacio (display_epaper.cpp) y
;   el banco de pruebas (hello_techo.cpp) quedan FUERA; compila src/epaper_techo.cpp.
;   ★ OJO CON EL COMENTARIO QUE HABIA AQUI (corregido 2026-09-15): decia que para
;   volver al firmware sin pantalla se cambiara esta linea por
;     src_filter = +<*> -<display.cpp> -<epaper_techo.cpp> -<hello_techo.cpp>
;   y eso esta MAL: no excluiria `display_epaper.cpp`, asi que se compilarian las DOS
;   versiones de la pantalla y el enlazador se quejaria (con razon: definen las mismas
;   funciones). La linea buena para quedarse SIN pantalla es:
;     src_filter = +<*> -<display.cpp> -<epaper_techo.cpp>
;   (asi entra display_epaper.cpp, el sustituto vacio).
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1       ; sin Bluetooth: ver la nota de arriba y la de ble_kiss.h
    ; ★★★ LA IMPRESION DE ERRORES DEL SOFTDEVICE, ENCENDIDA (b37, 2026-09-17) ★★★
    ;   `platform.txt` del framework trae `build.debug_flags=-DCFG_DEBUG=0`, y con eso el
    ;   manejador de errores que el core le pasa al SoftDevice (`nrf_error_cb`,
    ;   `bluefruit.cpp:118-140`) queda con su cuerpo VACIO: el SoftDevice avisa, la funcion
    ;   retorna, y el nodo reinicia SIN DECIR NADA. Eso es justo lo que nos ha tenido toda la
    ;   noche adivinando. Se redefine la variable (no se anade otro -D, para no chocar con el
    ;   =0) SOLO en este entorno, que es el de la placa del operador y el que se esta probando.
    ;   Coste: unos KB de flash. Beneficio: si el SoftDevice se queja, sale por el cable.
    -D build.debug_flags=-DCFG_DEBUG=1
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; ============================================================================
; ★★ APARATO DE MEDIDA DE LA PASTILLA TACTIL (2026-09-21) ★★
;
; PARA QUE: el tactil de la placa del operador dejo de responder y NO es cosa de la
; aplicacion (probado con el firmware aleman, con el nuestro y con el de fabrica, despues de
; reescribir el cargador y de un erase completo). Este firmware no arregla nada: MIDE. Pinta
; en la pantalla, en vivo, lo que el chip ve en P0.11 con y sin resistencia interna, cuantos
; flancos hay, y el estado de los pines de alimentacion.
;
; Compila SOLO `hello_pad.cpp` + el driver de la tinta: sin radio, sin GPS, sin sensores, sin
; configuracion y sin tocar la flash. Es lo mas pequeno que puede contestar la pregunta.
;
; NO ENTRA EN LAS TANDAS NORMALES: hay que pedirlo por su nombre.
; ============================================================================
[env:techo_plus_pad]
board = techo-nrf52840-s140v7
build_src_filter = +<hello_pad.cpp> +<epaper_techo.cpp> +<diag_banco.cpp> -<main.cpp>
; ★ SOLO las librerias que el driver de la tinta necesita de verdad. NO se declara la de
;   TinyUSB: en vez de traerla entera (que arrastra SdFat y no compila en un proyecto sin el
;   nucleo completo), se le da a `Wire` un sustituto de una linea. Ver el porque, largo, en
;   `extra_scripts/pad_banco/Adafruit_TinyUSB.h`.
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.7.1
    adafruit/Adafruit DRV2605 Library
lib_ldf_mode = deep+
build_flags =
    -I extra_scripts/pad_banco
    -Wall
    -std=gnu++17
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
    -DAPP_VERSION_STR=\"pad\"
    -DAPP_BUILD_NUM=\"pad\"
extra_scripts =
    extra_scripts/nrf52_uf2.py

; ============================================================================
; ★★ BORRADOR DE LA FLASH (2026-09-21) ★★
;
; PARA QUE: dejar en blanco TODO lo que no es el cargador de arranque. Borra de 0x27000 a
; 0xE9FFF: aplicacion, registro de viaje, configuracion y sistema de ficheros del nucleo.
; NO toca el MBR, el SoftDevice, el cargador (que empieza en 0xF4000) ni el UICR. Despues de
; borrar, la placa se reinicia, el cargador ve la aplicacion invalida y **se queda en modo
; UF2**, asi que se puede volver a grabar cualquier cosa: es un borrado, no un ladrillo.
;
; ★ La rutina de borrado VIVE EN LA RAM (ver el comentario largo de src/borra_flash.cpp):
;   un programa no puede borrar la flash que esta ejecutando.
;
; ★ SE PIDE A MANO, con DOS confirmaciones: mantener el boton 2 s para armar, soltar, y
;   volver a mantenerlo 2 s para borrar. Si no se confirma, no se borra nada.
;
; ★★ FICHERO DE UN SOLO USO. No entra en las tandas normales.
; ============================================================================
[env:techo_plus_borra]
board = techo-nrf52840-s140v7
build_src_filter = +<borra_flash.cpp> +<diag_banco.cpp> -<main.cpp>
lib_deps =
build_flags =
    -I extra_scripts/pad_banco
    -Wall
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
    -DAPP_VERSION_STR=\"borra\"
    -DAPP_BUILD_NUM=\"borra\"
extra_scripts =
    extra_scripts/nrf52_uf2.py

; ============================================================================
; ★★★ EL T-ECHO PLUS CON LA SOFTDEVICE 6.1.1 — LA DE FABRICA (b47, 2026-09-17) ★★★
;
; POR QUE EXISTE ESTE ENTORNO, y es el hallazgo mas importante de la noche:
;   Los DOS firmwares que funcionan en esta placa estan compilados para la **S140 6.1.1**:
;     - Meshtastic (su `boards\t-echo.json`: `nrf52840_s140_v6.ld`, `sd_fwid 0x00B6`);
;     - el firmware de fabrica de LilyGO (el que trae su repo).
;   Y **TODO lo que se cae esta enlazado para la v7** (aplicacion en `0x27000`): nuestro
;   firmware y el de fabrica de LilyGO cuando se graba sobre una placa con la v7.
;   Ademas, el volcado que el propio repo de LilyGO llama `CURRENT.UF2` lleva **Meshtastic con
;   la 6.1.1 dentro**: o sea que la placa, cuando funcionaba, tenia la v6.
;
;   Con este entorno el firmware se enlaza como el de Meshtastic: aplicacion en **0x26000**,
;   RAM en **0x20006000** y la sonda esperando el `fwid` **0x00B6**. **No se pierde nada de lo
;   nuestro**: el codigo es el mismo (la pila BLE es la misma API 7); lo unico que cambia es
;   DONDE se coloca.
;
; REQUISITO: la placa tiene que llevar grabada la S140 **6.1.1**. Si lleva otra cosa, la sonda
; estricta lo dice (`ble`) y **no se arranca el Bluetooth** en vez de entrar en bucle.
; ============================================================================
[env:techo_plus_s140v6]
board = techo-nrf52840-s140v6
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<hello_techo.cpp> -<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x00B6
    -D build.debug_flags=-DCFG_DEBUG=1
    ; ★ LA PRUEBA DE ARRANCAR LA SOFTDEVICE A MANO (b50/b51) YA DIO SU RESULTADO Y SE QUITA:
    ;   el nodo se caia igual, asi que "arrancarla a mano desde el firmware" tampoco basta.
    ;   El codigo de la prueba sigue en `ble_kiss.cpp` detras de este define, por si hay que
    ;   repetirla; no se compila si no se pone aqui.
extra_scripts =
    extra_scripts/nrf52_uf2.py
    pre:extra_scripts/sube_buildnum.py

; ============================================================================
; ★★★ EL MINIMO ABSOLUTO — LA BASE DE LA BISECCION (b60, 2026-09-17) ★★★
;
; PARA QUE: el nodo se cae en el arranque incluso con el Bluetooth forzado a apagado, asi que
; el fallo puede estar en CUALQUIERA de las piezas del firmware grande. Este entorno compila
; SOLO `minimo\main.cpp`: enciende el cable y contesta, nada mas (ni radio, ni pantalla, ni
; GPS, ni flash, ni SoftDevice). Es la base desde la que se van anadiendo las piezas del
; firmware del nodo de una en una hasta que se caiga: la que lo tumbe es la culpable.
;
; NO lleva el gancho del contador de compilacion: es una prueba, no un firmware de release, y
; no debe gastar numeros de la tanda.
; ============================================================================
[env:techo_minimo_v6]
board = techo-nrf52840-s140v6
src_dir = minimo
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x00B6
extra_scripts =
    extra_scripts/nrf52_uf2.py

;
; ============================================================================
; ★★★ BANCO DE PRUEBAS DEL ARRANQUE DEL SOFTDEVICE — "EL BUILD QUE CUENTA" (2026-09-17) ★★★
;
; PARA QUE: saber POR QUE se cuelga el nodo al arrancar el Bluetooth en vez de volver a
; adivinarlo. Responde a UNA pregunta: ¿el fallo esta en el SoftDevice o en la aplicacion
; grande? Y lo hace SIN PODER DEJAR EL NODO EN BUCLE.
;
; QUE COMPILA: SOLO `diag_sd\main.cpp` (fuera de `src/`, a proposito: asi no puede entrar por
; error en el firmware del nodo, igual que el banco viejo `_BLE_DIAG`). NO lleva radio, ni
; pantalla, ni GPS, ni registro, ni protocolo, ni `ble_kiss.cpp`, y NO llama a
; `Bluefruit.begin()`: arranca el SoftDevice A MANO para poder APUNTAR EL CODIGO DE ERROR de
; cada llamada.
;
; POR QUE NO PUEDE DEJAR EL NODO EN BUCLE:
;   1) NO LEE EL USB EN NINGUN MOMENTO (no hay ni una lectura del puerto ni una espera suya):
;      el nodo no se puede quedar bloqueado esperando al PC.
;   2) NO SE REINICIA SOLO: ni vigilante (WDT) ni `NVIC_SystemReset()` en el camino normal.
;      Un fallo duro deja los registros en la flash y se queda parado.
;   3) TODO lo que cuenta va a la FLASH (pagina 0xE7000), que sobrevive al reinicio, y se lee
;      DESPUES con `tools\lee_rastro.py` desde el `CURRENT.UF2` del cargador: SIN abrir
;      ningun puerto COM.
;   4) Si un paso falla, se PARA y late el LED. Un nodo parado se puede leer; uno en bucle, no.
;
; ★ SE COMPILA APARTE Y NO ENTRA EN LA TANDA: `tools\compila_tanda.ps1` compila los CUATRO
;   entornos de release y no toca este. Se pide a mano:
;       powershell -NoProfile -File tools\compila_tanda.ps1 -Entornos techo_diag_sd
;   (o directamente `pio run -e techo_diag_sd`).
;
; ★ NO LLEVA `pre:extra_scripts/sube_buildnum.py`: no gasta numero de compilacion, porque no
;   es firmware del nodo y no se consulta con el verbo `version`. El firmware de verdad no
;   cambia ni un byte por tener este entorno aqui.
; ============================================================================
[env:techo_diag_sd]
board = techo-nrf52840-s140v7
; Solo el banco de pruebas: fuera todo `src/`.
build_src_filter = +<diag_sd_main.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
; Sin librerias propias: lo unico que hace falta es el USB (que el core arranca solo) y las
; cabeceras del SoftDevice, que vienen con el framework.
lib_deps =
lib_ldf_mode = deep+
build_flags =
    -Wall
    -std=gnu++17
    -DAPP_VERSION_STR=\"diag_sd\"
    -DAPP_BUILD_NUM=\"diag\"
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
extra_scripts =
    extra_scripts/nrf52_uf2.py

; ============================================================================
; ★ ENTORNO DE DIAGNOSIS (2026-09-22): el Plus SIN el modulo de tracks.
;
; PARA QUE: el operador reporta que el b126 no arranca en su T-Echo Plus. El fichero UF2 esta
; bien (ficha del SoftDevice correcta, vector de arranque valido, sin MBR ni cargador) y el mapa
; de memoria cuadra. Asi que hay que averiguar si el culpable es el CODIGO NUEVO o el resto.
;
; COMO: es una COPIA EXACTA de `techo_plus_s140v7` con una sola diferencia -- `TRACKS_FUERA`
; deja el modulo de tracks sin compilar (ver el #if de tracks.h). Si este arranca, el fallo esta
; en el modulo de tracks; si tampoco arranca, el fallo NO es de ese modulo.
;
; NO ENTRA EN LAS TANDAS NORMALES: hay que pedirlo por su nombre.
; ============================================================================
[env:techo_plus_diag_sintracks]
board = techo-nrf52840-s140v7
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<hello_techo.cpp> -<diag_sd_main.cpp> -<ble_kiss.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
    -D TRACKS_FUERA=1
extra_scripts =
    extra_scripts/nrf52_uf2.py

[env:techo_plus_diag_sininit]
board = techo-nrf52840-s140v7
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<hello_techo.cpp> -<diag_sd_main.cpp> -<ble_kiss.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
    ; ★ Modulo COMPLETO, pero SIN llamar a tracksInit() al arrancar (ver main.cpp).
    -D TRACKS_SIN_INIT=1
extra_scripts =
    extra_scripts/nrf52_uf2.py

[env:techo_plus_diag_sinGrabar]
board = techo-nrf52840-s140v7
src_filter = +<*> -<display.cpp> -<display_epaper.cpp> -<hello_techo.cpp> -<diag_sd_main.cpp> -<ble_kiss.cpp> -<hello_pad.cpp> -<diag_banco.cpp> -<borra_flash.cpp>
build_flags =
    ${env.build_flags}
    -D FAKETEC_BOARD_TECHO
    -D TEchoPlus
    -D HAS_OLED=0
    -D SD_ESPERADO_FWID=0x0100
    -D BLE_FUERA=1
    ; ★ Modulo completo y arranque completo, pero SIN escribir en la flash (ver tracks.cpp).
    -D TRACKS_SIN_GRABAR=1
extra_scripts =
    extra_scripts/nrf52_uf2.py
